<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Lab 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.5;
        }
        h1 { color: #234b75; }
        .panel {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 18px;
            margin: 18px 0;
            background: #fafafa;
        }
        button {
            padding: 10px 16px;
            margin: 4px 8px 12px 0;
            border: 0;
            border-radius: 5px;
            background: #2463a6;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background: #174878; }
        .output {
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 12px;
            min-height: 45px;
            background: white;
            overflow-wrap: anywhere;
        }
        .error { color: #b00020; }
        .success { color: #176b32; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Exploring the Fetch API</h1>
    <p>This page demonstrates a GET request and a POST request using the Fetch API.</p>

    <section class="panel">
        <h2>GET Request</h2>
        <button id="loadData">Load Post Data</button>
        <div id="output" class="output" aria-live="polite">Click “Load Post Data” to retrieve the post.</div>
    </section>

    <section class="panel">
        <h2>POST Request</h2>
        <button id="createPost">Create New Post</button>
        <div id="postOutput" class="output" aria-live="polite">Click “Create New Post” to send sample post data.</div>
    </section>

    <script>
        const output = document.getElementById("output");
        const postOutput = document.getElementById("postOutput");

        document.getElementById("loadData").addEventListener("click", async () => {
            output.textContent = "Loading post data...";
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();

                const title = document.createElement("p");
                const titleLabel = document.createElement("strong");
                titleLabel.textContent = "Post Title: ";
                title.append(titleLabel, document.createTextNode(data.title));

                const body = document.createElement("p");
                const bodyLabel = document.createElement("strong");
                bodyLabel.textContent = "Content: ";
                body.append(bodyLabel, document.createTextNode(data.body));

                output.replaceChildren(title, body);
            } catch (error) {
                output.innerHTML = "";
                const message = document.createElement("span");
                message.className = "error";
                message.textContent = `Unable to load post data: ${error.message}`;
                output.appendChild(message);
            }
        });

        document.getElementById("createPost").addEventListener("click", async () => {
            postOutput.textContent = "Sending new post...";
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=UTF-8"
                    },
                    body: JSON.stringify({
                        title: "My New Post",
                        body: "Learning Fetch API is fun!",
                        userId: 1
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                postOutput.innerHTML = "";
                const confirmation = document.createElement("p");
                confirmation.className = "success";
                confirmation.textContent = "New Post Created!";
                const id = document.createElement("p");
                const label = document.createElement("strong");
                label.textContent = "Post ID: ";
                id.append(label, document.createTextNode(String(data.id)));
                postOutput.append(confirmation, id);
            } catch (error) {
                postOutput.innerHTML = "";
                const message = document.createElement("span");
                message.className = "error";
                message.textContent = `Unable to create post: ${error.message}`;
                postOutput.appendChild(message);
            }
        });
    </script>
</body>
</html>
